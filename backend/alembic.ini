# A generic, single database configuration for Alembic.

[alembic]
# path to migration scripts
script_location = migrations

# template used to generate migration files
# file_template = %%(year)d_%%(month)02d_%%(day)02d_%%(hour)02d%%(minute)02d-%%(rev)s_%%(slug)s

# sys.path path, path separator is '%(path_sep)s'
# prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# timezone =

# max length of characters to truncate the migration slug to
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow Alembic to purge
# unnamed constraints when running in autogenerate mode
# require_named_constraints = false

# version locations - for multi-specification, separator is dependency line breaks
# version_locations = %(here)s/bar:%(here)s/bat:migrations/versions

# version path separator; defaults to OS-specific path separator
# version_path_separator = :

sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/oncology_ai

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
datefmt = %H:%M:%S
