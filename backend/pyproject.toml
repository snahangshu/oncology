[tool.poetry]
name = "oncology_ai"
version = "0.1.0"
description = "Oncology AI Clinical Scheduling & Intake Assistant"
authors = ["Oncology AI Team <info@oncology.ai>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.28.0"}
pydantic = "^2.6.4"
pydantic-settings = "^2.2.1"
sqlalchemy = "^2.0.28"
psycopg2-binary = "^2.9.9"
redis = "^5.0.3"
celery = "^5.3.6"
ortools = "^9.9.3963"
anthropic = "^0.21.3"
alembic = "^1.13.1"
python-multipart = "^0.0.9"
websockets = "^12.0"
jinja2 = "^3.1.3"
pymupdf = "^1.27.2.3"
pillow = "^12.2.0"
openai = "^2.38.0"
PyJWT = "^2.8.0"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
email-validator = "^2.1.1"
bcrypt = "4.0.1"
cloudinary = "^1.44.2"
python-jose = {extras = ["cryptography"], version = "^3.5.0"}

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-asyncio = "^0.23.5"
httpx = "^0.27.0"
black = "^24.2.0"
ruff = "^0.3.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
line-length = 88
target-version = "py311"
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "T20", "RET", "SIM", "ARG"]
